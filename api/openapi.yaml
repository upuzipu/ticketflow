openapi: 3.0.3
info:
  title: TicketFlow API
  version: 1.2.0
  description: >
    Ticket sales platform: auth (auto-login on register), events catalog,
    atomic ticket holds, purchase saga with idempotency, real-time
    availability over WebSocket. All payloads snake_case.
servers:
  - url: http://localhost:8080

tags:
  - name: auth
  - name: events
  - name: holds
  - name: orders
  - name: system

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: Domain error in the uniform envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: "domain: no tickets available"
    TokenPair:
      type: object
      properties:
        access:  { type: string, description: JWT, 15 min }
        refresh: { type: string, description: JWT, 7 days, rotate on use }
    Registered:
      type: object
      description: User created + immediate token pair (auto-login)
      properties:
        id:      { type: string, format: uuid }
        email:   { type: string, format: email }
        role:    { type: string, enum: [buyer, organizer] }
        access:  { type: string }
        refresh: { type: string }
    Me:
      type: object
      properties:
        id:   { type: string, format: uuid }
        role: { type: string, example: buyer }
    Money:
      type: object
      properties:
        amount:   { type: integer, description: minor units (kopecks) }
        currency: { type: string, example: RUB }
    TicketCategory:
      type: object
      properties:
        id:       { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        name:     { type: string }
        price:    { $ref: '#/components/schemas/Money' }
        total_qty: { type: integer }
    Event:
      type: object
      properties:
        id:           { type: string, format: uuid }
        organizer_id: { type: string, format: uuid }
        title:        { type: string }
        description:  { type: string }
        image_url:    { type: string, description: empty if not set }
        starts_at:    { type: string, format: date-time }
        status:       { type: string, enum: [draft, published, cancelled] }
        categories:
          type: array
          items: { $ref: '#/components/schemas/TicketCategory' }
        created_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time }
    EventList:
      type: object
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        next_cursor:
          type: string
          description: keyset cursor "<RFC3339>|<uuid>"; empty = no more pages
    AvailabilityCategory:
      type: object
      properties:
        category_id: { type: string, format: uuid }
        name:        { type: string }
        price:       { $ref: '#/components/schemas/Money' }
        total_qty:   { type: integer }
        available:   { type: integer }
        held:        { type: integer }
        sold:        { type: integer }
    Availability:
      type: object
      properties:
        event_id:    { type: string, format: uuid }
        server_time: { type: string, format: date-time }
        categories:
          type: array
          items: { $ref: '#/components/schemas/AvailabilityCategory' }
    Hold:
      type: object
      properties:
        hold_id:     { type: string, format: uuid }
        status:      { type: string, enum: [active, confirmed, released, expired] }
        expires_at:
          type: string
          format: date-time
          description: original hold deadline (creation time + TTL); not rewritten by the lifecycle
        tickets:     { type: integer, description: number of captured tickets }
        server_time: { type: string, format: date-time }
        order_id:
          type: string
          format: uuid
          description: present when the hold became a paid/confirmed order
    Order:
      type: object
      properties:
        id:          { type: string, format: uuid }
        status:      { type: string, enum: [pending, paid, failed, expired, confirmed, refunded] }
        total_minor: { type: integer }
        currency:    { type: string }
        hold_id:     { type: string, format: uuid }
        created_at:  { type: string, format: date-time }
        created:
          type: boolean
          description: present only in POST /orders responses; false = idempotent replay
    OrderList:
      type: object
      properties:
        orders:
          type: array
          items: { $ref: '#/components/schemas/Order' }
        next_cursor:
          type: string
          description: keyset cursor; empty = no more pages

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Register a buyer or organizer (auto-login)
      description: Creates the user and returns a fresh token pair. The refresh token is registered for rotation/revocation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, role]
              properties:
                email:    { type: string, format: email }
                password: { type: string, minLength: 8 }
                role:     { type: string, enum: [buyer, organizer] }
      responses:
        '201':
          description: User created with token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registered' }
        '403': { description: Role not allowed (admin/guest), $ref: '#/components/responses/Error' }
        '409': { description: Email already taken,    $ref: '#/components/responses/Error' }
        '422': { description: Validation failed,      $ref: '#/components/responses/Error' }

  /auth/login:
    post:
      tags: [auth]
      summary: Login with email and password
      description: Rate-limited to 5 requests per minute per IP (Retry-After in 429).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { description: Unknown email or wrong password (indistinguishable), $ref: '#/components/responses/Error' }
        '422': { description: Malformed body, $ref: '#/components/responses/Error' }
        '429': { description: Rate limit exceeded, $ref: '#/components/responses/Error' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the token pair
      description: The presented refresh token is revoked and a new pair is issued. Reusing a rotated token returns 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { description: Invalid, expired or revoked token, $ref: '#/components/responses/Error' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the refresh token
      description: Idempotent. The access token remains valid until it expires (≤15 min).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '204': { description: Revoked }
        '401': { description: Invalid token, $ref: '#/components/responses/Error' }

  /users/me:
    get:
      tags: [auth]
      summary: Current authenticated identity
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Identity from the access token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { description: Missing or invalid token, $ref: '#/components/responses/Error' }

  /events:
    post:
      tags: [events]
      summary: Create an event with priced ticket categories
      description: >
        Organizer or admin only. Categories validated (qty ≥ 1, positive price,
        currency set, https image_url ≤ 500 chars). Tickets generated for every
        category in the same transaction.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, starts_at, categories]
              properties:
                title:      { type: string }
                description: { type: string, maxLength: 2000 }
                starts_at:  { type: string, format: date-time }
                image_url:  { type: string, maxLength: 500, description: optional, https }
                categories:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [name, qty, price_minor, currency]
                    properties:
                      name:        { type: string }
                      qty:         { type: integer, minimum: 1 }
                      price_minor: { type: integer, minimum: 1 }
                      currency:    { type: string, example: RUB }
      responses:
        '201':
          description: Event created (draft), tickets generated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: Caller is not an organizer, $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    get:
      tags: [events]
      summary: List published events (keyset pagination)
      description: >
        With mine=true (organizer only) returns ALL events of the caller
        including drafts and cancelled.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: cursor
          in: query
          schema: { type: string }
          description: next_cursor from the previous page
        - name: mine
          in: query
          schema: { type: string, enum: ["true"] }
          description: organizer only; requires Bearer token; returns 403 otherwise
      responses:
        '200':
          description: Page of events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventList' }
        '403': { description: mine=true requested by a non-organizer, $ref: '#/components/responses/Error' }

  /events/{id}:
    get:
      tags: [events]
      summary: Event details with ticket categories
      description: >
        Published events are public. Drafts and cancelled are visible only
        to their owner (or admin); everyone else gets 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Event with categories
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '404': { description: Not found (or not published and not the owner), $ref: '#/components/responses/Error' }
        '422': { description: Bad uuid, $ref: '#/components/responses/Error' }

  /events/{id}/publish:
    post:
      tags: [events]
      summary: Publish the event (draft → published)
      description: Owner of the event or admin. FSM rejects repeated publication (409).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Published }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: Not the owner, $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: Invalid transition (already published/cancelled), $ref: '#/components/responses/Error' }

  /events/{id}/availability:
    get:
      tags: [events]
      summary: Per-category ticket counters
      description: Cached (10s TTL) + invalidated on release/confirm. snake_case.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Counters with server_time
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { description: Bad uuid, $ref: '#/components/responses/Error' }

  /events/{id}/holds:
    post:
      tags: [holds]
      summary: Reserve tickets (atomic hold, 10 min TTL)
      description: >
        Atomically captures qty available tickets of the category
        (SELECT … FOR UPDATE SKIP LOCKED). Concurrent reservers get different
        tickets or 409 sold-out. Rate-limited to 30 req/min per IP (Retry-After).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: event id (informational; the category defines the event)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_id, qty]
              properties:
                category_id: { type: string, format: uuid }
                qty:         { type: integer, minimum: 1, maximum: 10 }
      responses:
        '201':
          description: Hold created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hold' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { description: Not enough tickets, $ref: '#/components/responses/Error' }
        '410': { description: Hold expired, $ref: '#/components/responses/Error' }
        '422': { description: Validation failed (qty bounds, bad uuid), $ref: '#/components/responses/Error' }
        '429': { description: Rate limit exceeded, $ref: '#/components/responses/Error' }

  /holds/{id}:
    get:
      tags: [holds]
      summary: Hold status (owner only)
      description: >
        Lets the client check whether a hold is still active after a page
        refresh. order_id is filled when the hold became a paid/confirmed order.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Hold status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hold' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: Hold belongs to another user, $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [holds]
      summary: Release the hold (tickets back to sale)
      description: Owner only. Idempotent.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Released (or already released) }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: Hold belongs to another user, $ref: '#/components/responses/Error' }

  /orders:
    post:
      tags: [orders]
      summary: Purchase saga — create the order from a hold and charge
      description: >
        Requires idempotency_key (uuid): repeated calls with the same key return
        the same order (200, created=false). On gateway decline — 402 and tickets
        are released (compensation). On gateway timeout — 424, order stays
        pending. Rate-limited to 20 req/min per IP.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hold_id, idempotency_key]
              properties:
                hold_id:         { type: string, format: uuid }
                idempotency_key: { type: string, format: uuid }
      responses:
        '201':
          description: Order created and paid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '200':
          description: Idempotent replay — existing order returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Error' }
        '402': { description: Payment declined (order failed, tickets released), $ref: '#/components/responses/Error' }
        '403': { description: Hold belongs to another user, $ref: '#/components/responses/Error' }
        '404': { description: Hold not found, $ref: '#/components/responses/Error' }
        '409': { description: Hold not active, $ref: '#/components/responses/Error' }
        '410': { description: Hold expired, $ref: '#/components/responses/Error' }
        '422': { description: Bad idempotency key / hold id, $ref: '#/components/responses/Error' }
        '424': { description: Gateway timeout — order pending review, $ref: '#/components/responses/Error' }
  /orders/mine:
    get:
      tags: [orders]
      summary: The authenticated user's orders (history)
      description: >
        Keyset pagination by created_at DESC (newest first). Cursor format
        "<RFC3339>|<uuid>", comparison strictly older. limit default 20, max 100.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Page of orders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderList' }
        '401': { $ref: '#/components/responses/Error' }
  /orders/{id}/pay:
    post:
      tags: [orders]
      summary: Charge a pending order
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Paid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Error' }
        '402': { description: Payment declined, $ref: '#/components/responses/Error' }
        '403': { description: Not the owner, $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: Order is not payable (wrong status), $ref: '#/components/responses/Error' }
        '424': { description: Gateway timeout, $ref: '#/components/responses/Error' }
  /orders/{id}:
    get:
      tags: [orders]
      summary: Order status (owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: Not the owner, $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /ws/events/{id}:
    get:
      tags: [system]
      summary: WebSocket availability stream for the event
      description: >
        Upgrade to WebSocket. Contract: on EVERY connect (including reconnect)
        the server immediately sends one full availability snapshot frame,
        then a new full snapshot on every inventory change.
        Frame: {"type":"availability","event_id":…,"server_time":…,
        "categories":[…]} with snake_case fields.
        Server sends a protocol-level ping every 20 s; automatic browser
        pongs count as liveness. No client heartbeat required.
        Allowed origins (dev): localhost:3000, localhost:8080.
        Without the Upgrade header the endpoint responds 501.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '101': { description: Switching Protocols (WebSocket) }
        '501': { description: Not a WebSocket upgrade request }

  /livez:
    get:
      tags: [system]
      summary: Liveness probe
      responses:
        '200': { description: OK }
  /metrics:
    get:
      tags: [system]
      summary: Prometheus exposition
      responses:
        '200':
          description: Plain-text metrics
          content:
            text/plain: {}